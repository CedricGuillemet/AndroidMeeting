plugins {
    id 'com.android.library'
}

// JavaScript engine used by Babylon Native (V8, JavaScriptCore, QuickJS...).
def jsEngine = "QuickJS"
if (project.hasProperty("jsEngine")) {
    jsEngine = project.property("jsEngine")
}

// Graphics API. OpenGL is required for the transparent GL back-buffer path
// (SurfaceFlinger blends the RGBA back buffer; alpha == 0 -> transparent).
def graphics_api = "OpenGL"
if (project.hasProperty("GRAPHICS_API")) {
    graphics_api = project.property("GRAPHICS_API")
}

// Shader flavor. By default the AAR ships WITHOUT the runtime shader compiler
// (smallest .so; a prebuilt shader cache is required at runtime). Pass
// -PdynamicShaders to bundle the glslang/SPIRV-Cross shader compiler so shaders
// compile at runtime with no prebuilt cache.
def dynamicShaders = project.hasProperty("dynamicShaders")

def cmakeArguments = [
    // Statically link libc++ so libBabylonNativeEmbedding.so is self-contained and
    // does NOT depend on the app's libc++_shared.so at runtime. A consuming app
    // (e.g. Teams) ships its own, older libc++_shared.so which wins the jniLibs
    // pickFirst merge and lacks newer symbols (e.g. __cxa_init_primary_exception)
    // this NDK's libc++ needs -> dlopen of the shared-STL build fails. Static STL
    // avoids that ABI-version conflict entirely.
    "-DANDROID_STL=c++_static",
    "-DENABLE_PCH=OFF",
    "-DGRAPHICS_API=${graphics_api}",
    "-DNAPI_JAVASCRIPT_ENGINE=${jsEngine}",
    "-DBABYLON_NATIVE_EMBEDDING=ON",
    // Upstream's Android JNI layer is disabled; CMakeLists.txt builds our own
    // multiview BabylonNativeEmbedding target from a local source.
    "-DBABYLON_NATIVE_EMBEDDING_ANDROID=OFF",
    "-DBABYLON_NATIVE_BUILD_APPS=OFF",
    "-DBABYLON_NATIVE_INSTALL=OFF",
    // Disabled plugins / polyfills.
    "-DBABYLON_NATIVE_POLYFILL_CANVAS=OFF",
    "-DBABYLON_NATIVE_PLUGIN_NATIVECAMERA=OFF",
    "-DBABYLON_NATIVE_PLUGIN_NATIVECAPTURE=OFF",
    "-DBABYLON_NATIVE_PLUGIN_NATIVEXR=OFF",
    "-DBABYLON_NATIVE_PLUGIN_TESTUTILS=OFF",
    "-DBABYLON_NATIVE_PLUGIN_EXTERNALTEXTURE=OFF",
    "-DBABYLON_NATIVE_PLUGIN_NATIVETRACING=OFF",
    // Image loading (decode) and encoding are disabled in both flavors to shrink
    // the .so. The ShaderCache plugin is always enabled.
    "-DBABYLON_NATIVE_PLUGIN_NATIVEENGINE_LOAD_IMAGES=OFF",
    "-DBABYLON_NATIVE_PLUGIN_NATIVEENCODING=OFF",
    "-DBABYLON_NATIVE_PLUGIN_SHADERCACHE=ON",
    // Runtime shader compilation toggle (see CMakeLists.txt). OFF by default
    // (prebuilt shader cache required); -PdynamicShaders flips it ON to bundle
    // the glslang/SPIRV-Cross shader compiler for runtime compilation.
    "-DAM_DYNAMIC_SHADERS=${dynamicShaders ? 'ON' : 'OFF'}",
    // Networking polyfills not needed by this view.
    "-DBABYLON_NATIVE_POLYFILL_WEBSOCKET=OFF",
    "-DBABYLON_NATIVE_POLYFILL_URL=OFF"
]

// ABIs to build. Defaults to the full shipping set. Restrict with -PARM64Only
// (arm64 only) or -PtargetAbis=arm64-v8a,x86_64 (comma-separated) to cut native
// build time — e.g. CI builds device + emulator ABIs only.
def abiList = ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]
if (project.hasProperty("ARM64Only")) {
    abiList = ["arm64-v8a"]
} else if (project.hasProperty("targetAbis")) {
    abiList = project.property("targetAbis").toString().split(",").collect { it.trim() }.findAll { it }
}

android {
    namespace = 'com.babylonjs.meeting'
    compileSdk = 34

    defaultConfig {
        minSdk = 25

        consumerProguardFiles "consumer-rules.pro"

        ndkVersion = "29.0.14206865"
        if (project.hasProperty("NDK_VERSION")) {
            ndkVersion = project.property("NDK_VERSION")
        }

        externalNativeBuild {
            cmake {
                // Only build the embedding .so (and its transitive deps).
                targets "BabylonNativeEmbedding"
                abiFilters(abiList as String[])
                arguments(*cmakeArguments)
                // Minimal-size codegen applied to the whole native build
                // (BabylonNative + all fetched deps). -Oz optimizes hard for
                // size; function/data sections + hidden visibility let the
                // linker's --gc-sections drop everything unreferenced; ThinLTO
                // enables cross-module size reduction.
                def sizeFlags = [
                    "-Oz",
                    "-ffunction-sections",
                    "-fdata-sections",
                    "-fvisibility=hidden",
                    "-flto=thin"
                ]
                cFlags += sizeFlags
                cppFlags += sizeFlags + ["-fvisibility-inlines-hidden", "-Wno-deprecated-literal-operator"]
            }
        }

        ndk {
            abiFilters(abiList as String[])
        }
    }

    externalNativeBuild {
        cmake {
            version = '3.22.1+'
            path = 'CMakeLists.txt'
        }
    }

    packaging {
        jniLibs {
            // The JS engine may ship multiple copies across sub-projects.
            pickFirsts += ['lib/*/libv8android.so', 'lib/*/libjsc.so', 'lib/*/libc++_shared.so']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
