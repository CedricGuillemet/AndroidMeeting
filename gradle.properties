# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# AndroidX is required by modern AGP.
android.useAndroidX=true

# AGP 9.0 behaviour opt-outs (no shaders / resvalues / Kotlin in this library).
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.resvalues=false
android.uniquePackageNames=false

# JavaScript engine used by Babylon Native (V8 or JavaScriptCore).
jsEngine=V8

# Graphics API. OpenGL is required for the transparent GL back-buffer path.
GRAPHICS_API=OpenGL
