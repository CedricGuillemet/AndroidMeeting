name: Build AAR

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    # NDK version used to build the AAR. Pinned to match the consuming Teams app
    # (ext.versions.ndk) so the produced libc++_shared.so is ABI-compatible with
    # the one the app bundles. Change here to re-target a different NDK.
    env:
      NDK_VERSION: "27.2.12479018"
      CMAKE_VERSION: "3.22.1"

    # Four independent jobs, one per JavaScript engine / shader flavor
    # combination, each producing its own artifact.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the original QuickJS artifact names for compatibility.
          - flavor: shader-cache
            gradleArgs: ""
            label: "QuickJS + shader cache (prebuilt cache required)"
            aar: babylonview-shadercache-required-release.aar
            artifact: babylonview-shadercache-required-aar
          - flavor: dynamic-shaders
            gradleArgs: "-PdynamicShaders"
            label: "QuickJS + dynamic shaders (runtime compiler)"
            aar: babylonview-dynamic-shaders-release.aar
            artifact: babylonview-dynamic-shaders-aar
          - flavor: v8-shader-cache
            gradleArgs: "-PjsEngine=V8"
            label: "V8 + shader cache (prebuilt cache required)"
            aar: babylonview-v8-shadercache-required-release.aar
            artifact: babylonview-v8-shadercache-required-aar
          - flavor: v8-dynamic-shaders
            gradleArgs: "-PjsEngine=V8 -PdynamicShaders"
            label: "V8 + dynamic shaders (runtime compiler)"
            aar: babylonview-v8-dynamic-shaders-release.aar
            artifact: babylonview-v8-dynamic-shaders-aar

    name: build-${{ matrix.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and Ninja
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v4

      - name: Test instrumentation result verifier
        run: python3 -m unittest ci.test_verify_instrumentation_results

      - name: Build ${{ matrix.flavor }} AAR
        # BabylonNative + all of its dependencies (bgfx, the selected JavaScript
        # engine, and -- for dynamic flavors -- glslang/SPIRV-Cross) are fetched
        # and compiled by the external CMake build. Build the device (arm64-v8a)
        # and emulator (x86_64) ABIs so the AAR runs on both. NDK_VERSION is
        # passed through so the module builds against the app-matched NDK.
        run: ./gradlew :babylonview:assembleRelease ${{ matrix.gradleArgs }} -PtargetAbis=arm64-v8a,x86_64 -PNDK_VERSION=${NDK_VERSION} --no-daemon --stacktrace

      - name: Inspect ${{ matrix.flavor }} AAR
        run: bash ci/inspect.sh "${{ matrix.label }}"

      - name: Stage ${{ matrix.flavor }} AAR
        run: |
          mkdir -p artifacts
          cp babylonview/build/outputs/aar/babylonview-release.aar "artifacts/${{ matrix.aar }}"

      - name: Upload ${{ matrix.flavor }} AAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.aar }}
          if-no-files-found: error

  bridge-tests:
    needs: build-aar
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: shader-cache
            api: 35
            artifact: babylonview-shadercache-required-aar
            aar: babylonview-shadercache-required-release.aar
          - flavor: dynamic-shaders
            api: 35
            artifact: babylonview-dynamic-shaders-aar
            aar: babylonview-dynamic-shaders-release.aar
          - flavor: v8-shader-cache
            api: 35
            artifact: babylonview-v8-shadercache-required-aar
            aar: babylonview-v8-shadercache-required-release.aar
          - flavor: v8-dynamic-shaders
            api: 35
            artifact: babylonview-v8-dynamic-shaders-aar
            aar: babylonview-v8-dynamic-shaders-release.aar
          - flavor: dynamic-shaders
            api: 25
            artifact: babylonview-dynamic-shaders-aar
            aar: babylonview-dynamic-shaders-release.aar
          - flavor: v8-dynamic-shaders
            api: 25
            artifact: babylonview-v8-dynamic-shaders-aar
            aar: babylonview-v8-dynamic-shaders-release.aar

    name: bridge-${{ matrix.flavor }}-api${{ matrix.api }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v4

      - name: Download release AAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts

      - name: Require selected release AAR
        run: test -f "artifacts/${{ matrix.aar }}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run minified packaged-AAR instrumentation
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            AAR="$(pwd)/artifacts/${{ matrix.aar }}"
            timeout 30m ./gradlew :bridge-tests:connectedCiAndroidTest -PbridgeTestAar="${AAR}" --no-daemon --stacktrace
            python3 ci/verify_instrumentation_results.py bridge-tests/build/outputs/androidTest-results/connected

      - name: Collect logcat
        if: always()
        run: |
          mkdir -p bridge-test-diagnostics
          adb logcat -d -v threadtime > bridge-test-diagnostics/logcat.txt || true
          adb shell ls -la /data/tombstones > bridge-test-diagnostics/tombstones.txt 2>&1 || true

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-evidence-${{ matrix.flavor }}-api${{ matrix.api }}-x86_64
          path: |
            bridge-tests/build/outputs/androidTest-results
            bridge-tests/build/reports/androidTests
            bridge-test-diagnostics
          if-no-files-found: warn

  bridge-ci:
    if: always()
    needs: [build-aar, bridge-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build and emulator row
        env:
          BUILD_RESULT: ${{ needs.build-aar.result }}
          TEST_RESULT: ${{ needs.bridge-tests.result }}
        run: |
          test "${BUILD_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
