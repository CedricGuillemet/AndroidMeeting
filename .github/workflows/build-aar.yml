name: Build AAR

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and Ninja
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------------------
      # Flavor 1: shader-cache AAR (no runtime shader compiler).
      # Smallest .so. The app MUST supply a prebuilt GPU shader cache at runtime
      # via RuntimeOptions.shaderCachePath, or nothing renders.
      # ---------------------------------------------------------------------
      - name: Build shader-cache AAR (prebuilt cache required)
        # BabylonNative + all of its dependencies (bgfx, QuickJS, ...) are
        # fetched and compiled by the external CMake build. Build the device
        # (arm64-v8a) and emulator (x86_64) ABIs so the AAR runs on both.
        run: ./gradlew :babylonview:assembleRelease -PtargetAbis=arm64-v8a,x86_64 --no-daemon --stacktrace

      - name: Inspect shader-cache AAR
        run: bash ci/inspect.sh "shader-cache (prebuilt cache required)"

      - name: Stage shader-cache AAR
        run: |
          mkdir -p artifacts
          cp babylonview/build/outputs/aar/babylonview-release.aar \
             artifacts/babylonview-shadercache-required-release.aar

      # Fully isolate the two native builds so the diagnostics above/below and
      # the packaged .so are unambiguous.
      - name: Clean native build between flavors
        run: rm -rf babylonview/build babylonview/.cxx

      # ---------------------------------------------------------------------
      # Flavor 2: dynamic-shaders AAR (bundles the glslang/SPIRV-Cross shader
      # compiler). Larger .so, but compiles shaders at runtime -- no prebuilt
      # cache required.
      # ---------------------------------------------------------------------
      - name: Build dynamic-shaders AAR (runtime shader compiler)
        run: ./gradlew :babylonview:assembleRelease -PdynamicShaders -PtargetAbis=arm64-v8a,x86_64 --no-daemon --stacktrace

      - name: Inspect dynamic-shaders AAR
        run: bash ci/inspect.sh "dynamic shaders (runtime compiler)"

      - name: Stage dynamic-shaders AAR
        run: |
          cp babylonview/build/outputs/aar/babylonview-release.aar \
             artifacts/babylonview-dynamic-shaders-release.aar

      - name: Upload AARs
        uses: actions/upload-artifact@v4
        with:
          name: babylonview-aars
          path: artifacts/*.aar
          if-no-files-found: error
