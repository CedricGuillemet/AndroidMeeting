name: Build AAR

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and Ninja
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build BabylonView AAR
        # BabylonNative + all of its dependencies (bgfx, QuickJS, ...) are
        # fetched and compiled by the external CMake build. Build the device
        # (arm64-v8a) and emulator (x86_64) ABIs so the AAR runs on both.
        run: ./gradlew :babylonview:assembleRelease -PtargetAbis=arm64-v8a,x86_64 --no-daemon --stacktrace

      - name: Log native library (.so) sizes
        run: |
          echo "libBabylonNativeEmbedding.so sizes:"
          find babylonview/build -name 'libBabylonNativeEmbedding.so' -print0 \
            | xargs -0 --no-run-if-empty ls -lh
          echo "All .so sizes under build outputs:"
          find babylonview/build -name '*.so' -printf '%s\t%p\n' | sort -rn \
            | awk '{ printf "%10.2f MiB  %s\n", $1/1048576, $2 }'

      - name: Verify JNI symbols are exported
        # The size flags (hidden visibility, --exclude-libs, gc/icf) must not
        # strip the JNIEXPORT entry points the AAR's Java layer binds against.
        run: |
          SO=$(find babylonview/build -path '*stripReleaseDebugSymbols*arm64-v8a*' -name 'libBabylonNativeEmbedding.so' | head -n1)
          [ -z "$SO" ] && SO=$(find babylonview/build -name 'libBabylonNativeEmbedding.so' | head -n1)
          echo "Inspecting: $SO"
          NM=$(find "$ANDROID_HOME/ndk" -name 'llvm-nm' | head -n1)
          COUNT=$("$NM" -D --defined-only "$SO" | grep -c 'Java_com_babylonjs_embedding_BabylonNative_')
          echo "Exported Java_com_babylonjs_embedding_BabylonNative_* symbols: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No BabylonNative JNI symbols exported; size flags broke the ABI."
            exit 1
          fi

      - name: Report static archive (.a) link contributions
        # Parses the lld linker map emitted via -Wl,-Map to show which static
        # libraries were pulled into libBabylonNativeEmbedding.so and their size.
        run: |
          MAP=$(find babylonview -name 'BabylonNativeEmbedding.map' | head -n1)
          echo "Linker map: ${MAP:-<not found>}"
          if [ -n "$MAP" ]; then
            python3 ci/report_link_sizes.py "$MAP"
          else
            echo "No linker map found; skipping .a report."
          fi

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: babylonview-aar
          path: babylonview/build/outputs/aar/*.aar
          if-no-files-found: error
