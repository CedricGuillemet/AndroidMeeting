name: Build AAR

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    # NDK version used to build the AAR. Pinned to match the consuming Teams app
    # (ext.versions.ndk) so the produced libc++_shared.so is ABI-compatible with
    # the one the app bundles. Change here to re-target a different NDK.
    env:
      NDK_VERSION: "27.2.12479018"
      CMAKE_VERSION: "3.22.1"

    # Two independent jobs, one per shader flavor, each producing its own
    # artifact so the size difference between them is easy to compare.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flavor 1: no runtime shader compiler. Smallest .so. The app MUST
          # supply a prebuilt GPU shader cache at runtime
          # (RuntimeOptions.shaderCachePath), or nothing renders.
          - flavor: shader-cache
            gradleArgs: ""
            label: "shader-cache (prebuilt cache required)"
            aar: babylonview-shadercache-required-release.aar
            artifact: babylonview-shadercache-required-aar
          # Flavor 2: bundles the glslang/SPIRV-Cross shader compiler. Larger
          # .so, but compiles shaders at runtime -- no prebuilt cache required.
          - flavor: dynamic-shaders
            gradleArgs: "-PdynamicShaders"
            label: "dynamic shaders (runtime compiler)"
            aar: babylonview-dynamic-shaders-release.aar
            artifact: babylonview-dynamic-shaders-aar

    name: build-${{ matrix.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and Ninja
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.flavor }} AAR
        # BabylonNative + all of its dependencies (bgfx, QuickJS, and -- for the
        # dynamic flavor -- glslang/SPIRV-Cross) are fetched and compiled by the
        # external CMake build. Build the device (arm64-v8a) and emulator
        # (x86_64) ABIs so the AAR runs on both. NDK_VERSION is passed through so
        # the module builds against the app-matched NDK.
        run: ./gradlew :babylonview:assembleRelease ${{ matrix.gradleArgs }} -PtargetAbis=arm64-v8a,x86_64 -PNDK_VERSION=${NDK_VERSION} --no-daemon --stacktrace

      - name: Inspect ${{ matrix.flavor }} AAR
        run: bash ci/inspect.sh "${{ matrix.label }}"

      - name: Stage ${{ matrix.flavor }} AAR
        run: |
          mkdir -p artifacts
          cp babylonview/build/outputs/aar/babylonview-release.aar "artifacts/${{ matrix.aar }}"

      - name: Upload ${{ matrix.flavor }} AAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.aar }}
          if-no-files-found: error
